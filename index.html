<title>稻香活動相簿</title>

<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky folder bar over a masonry-style grid; one album per view, routed by #hash; lightbox for full size */
:root {
  --bg: #f5f6ef;
  --surface: #ffffff;
  --fg: #23291f;
  --muted: #646d5c;
  --line: #dde1d2;
  --accent: #4f7a3a;       /* rice-stalk green */
  --gold: #b8892a;         /* ripe grain */
  --chip-on-fg: #ffffff;
  --shadow: 0 1px 2px rgba(35,41,31,.08), 0 4px 14px rgba(35,41,31,.06);
  --font-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a14; --surface: #1f251c; --fg: #e9ecdf; --muted: #a2ab95; --line: #313a2c;
  --accent: #8fbf6f; --gold: #d9ad55; --chip-on-fg: #14180f; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161a14; --surface: #1f251c; --fg: #e9ecdf; --muted: #a2ab95; --line: #313a2c;
  --accent: #8fbf6f; --gold: #d9ad55; --chip-on-fg: #14180f; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 32px 12px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--gold); font-weight: 700; }
h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 700; margin: 4px 0 6px; line-height: 1.2; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.chip .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--chip-on-fg); }
.chip[aria-current="page"] .n { color: inherit; opacity: .8; }
.chip:focus-visible, .tile:focus-visible, .lb button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

main { padding-block: 24px 64px; }
.album-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 16px; }
.album-head h2 { font-family: var(--font-display); font-size: clamp(24px, 3.6vw, 32px); margin: 0; }
.album-head .meta { color: var(--muted); font-size: 14px; }

/* overview: cover cards */
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 18px; }
.cover { display: block; text-decoration: none; color: inherit; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.cover .imgs { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; aspect-ratio: 4/3; max-width: 100%; }
.cover .imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .imgs img:first-child { grid-row: span 2; }
.cover .cap { padding: 12px 14px 14px; }
.cover .cap b { font-family: var(--font-display); font-size: 20px; font-weight: 700; display: block; }
.cover .cap span { color: var(--muted); font-size: 13px; }
.cover:hover b { color: var(--accent); }

/* album grid: CSS columns for natural aspect ratios */
.grid { columns: 4 240px; column-gap: 12px; }
.tile { position: relative; display: block; width: 100%; break-inside: avoid; margin: 0 0 12px; padding: 0; border: 0; background: var(--line); border-radius: 10px; overflow: hidden; cursor: zoom-in; }
.tile img { display: block; width: 100%; height: auto; transition: transform .3s ease; }
.tile:hover img { transform: scale(1.03); }
.tile .play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.tile .play i { width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
.tile .play i::after { content: ""; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
.tile .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 6px; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,9,.94); display: grid; grid-template-rows: auto 1fr auto; color: #f2f3ec; }
.lb-top, .lb-bot { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.lb-top { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.lb-bot { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); justify-content: center; font-size: 14px; color: #c9cdbf; font-variant-numeric: tabular-nums; }
.lb-title { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 0 56px; }
.lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.lb button { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px; cursor: pointer; display: grid; place-items: center; }
.lb button:hover { background: rgba(255,255,255,.22); }
.lb .nav { position: absolute; top: 50%; transform: translateY(-50%); }
.lb .prev { left: max(8px, env(safe-area-inset-left, 0px)); }
.lb .next { right: max(8px, env(safe-area-inset-right, 0px)); }
.lb a.dl { color: #fff; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 600px) { .lb-stage { padding: 0; } .lb .nav { top: auto; bottom: 8px; transform: none; } }
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
</style>
</head>

<style>
.lock { min-height: 70vh; display: grid; place-items: center; padding-block: 40px; }
.lock form { width: min(100%, 360px); display: grid; gap: 12px; background: var(--surface); padding: 28px 24px; border-radius: 16px; box-shadow: var(--shadow); }
.lock h1 { font-size: 30px; margin: 0; }
.lock p { margin: 0; color: var(--muted); font-size: 14px; }
.lock input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
.lock input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
.lock button { font: inherit; font-weight: 700; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: var(--chip-on-fg); cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: wait; }
.lock .err { color: #c0392b; min-height: 1.4em; }
.tile img:not([src]), .cover .imgs img:not([src]) { visibility: hidden; }
.lb-stage .loading { color: #c9cdbf; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--fg); padding: 5px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.seg button .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--chip-on-fg); }
.seg button[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.seg button:disabled { opacity: .4; cursor: default; }
.seg button:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
.album-head .seg { margin-left: auto; }
.group { display: grid; gap: 12px; margin-bottom: 28px; }
.group h3 { font-family: var(--font-display); font-size: 22px; margin: 0; display: flex; gap: 10px; align-items: baseline; }
.group h3 a { color: inherit; text-decoration: none; }
.group h3 a:hover { color: var(--accent); }
.group h3 span { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); padding-block: 32px; }
</style>

  <form id="lockForm" autocomplete="off">

    <button id="unlockBtn" type="submit">開啟相簿</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
<header class="top wrap">
  <div class="eyebrow">2026 年 11 月 · 活動紀錄</div>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = t => t.replace(/_/g, '・');
let KEY = null, ALBUMS = [];

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
const decrypt = buf => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, KEY, buf.slice(12));

// decrypted blob URLs, cached; limited parallel fetches
const cache = new Map(); let active = 0; const queue = [];
function pump() { while (active < 6 && queue.length) { const job = queue.shift(); active++; job().finally(() => { active--; pump(); }); } }
function blobUrl(path, mime) {
  if (cache.has(path)) return cache.get(path);
  const p = new Promise((res, rej) => { queue.push(async () => {
    try { const r = await fetch(path); if (!r.ok) throw new Error(r.status); const data = await decrypt(new Uint8Array(await r.arrayBuffer())); res(URL.createObjectURL(new Blob([data], { type: mime }))); }
    catch (e) { cache.delete(path); rej(e); } }); pump(); });
  cache.set(path, p); return p;
}
function fillImgs(root) { root.querySelectorAll('img[data-enc]').forEach(img => blobUrl(img.dataset.enc, 'image/jpeg').then(u => { img.src = u; }).catch(() => {})); }

async function unlock(pw, remember) {
  KEY = await deriveKey(pw);
  const data = await decrypt(b64(MANIFEST));  // throws on wrong password
  ALBUMS = JSON.parse(new TextDecoder().decode(data));
  if (remember) try { sessionStorage.setItem('k', pw); } catch (e) {}
  $('lock').hidden = true; $('app').hidden = false;
  const tp = ALBUMS.reduce((s,a)=>s+a.items.filter(i=>i.type==='photo').length,0), tv = ALBUMS.reduce((s,a)=>s+a.items.filter(i=>i.type==='video').length,0);
  $('summary').textContent = `${ALBUMS.length} 個活動・${tp} 張照片・${tv} 段影片`;
  window.addEventListener('hashchange', route); route();
}
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = ''; $('unlockBtn').disabled = true; $('unlockBtn').textContent = '解鎖中…';
  try { await unlock($('pw').value, true); }
  catch (err) { $('err').textContent = '密碼不正確，請再試一次。'; $('pw').select(); }
  finally { $('unlockBtn').disabled = false; $('unlockBtn').textContent = '開啟相簿'; }
});
try { const saved = sessionStorage.getItem('k'); if (saved) unlock(saved, false).catch(() => {}); } catch (e) {}

const counts = a => { const v = a.items.filter(i => i.type === 'video').length; return `${a.items.length - v} 張照片` + (v ? `・${v} 段影片` : ''); };
let current = null, filter = 'all', view = [];
try { filter = sessionStorage.getItem('f') || 'all'; } catch (e) {}
const match = it => filter === 'all' || it.type === filter;
function seg(items) {
  const n = { all: items.length, photo: items.filter(i => i.type === 'photo').length, video: items.filter(i => i.type === 'video').length };
  return `<div class="seg" role="group" aria-label="篩選類型">${[['all','全部'],['photo','照片'],['video','影片']].map(([k,t]) =>
    `<button type="button" data-f="${k}" aria-pressed="${filter === k}" ${n[k] || filter === k ? '' : 'disabled'}>${t}<span class="n">${n[k]}</span></button>`).join('')}</div>`;
}
function bindSeg() {
  $('main').querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f; try { sessionStorage.setItem('f', filter); } catch (e) {}
    render(); const f = $('main').querySelector(`.seg button[data-f="${filter}"]`); if (f) f.focus();
  }));
}
const tile = (e, i) => `<button class="tile" data-i="${i}" aria-label="${esc(e.it.name)}"><img data-enc="${e.it.thumb}" alt="${esc(e.it.name)}" width="${e.it.w}" height="${e.it.h}" style="aspect-ratio:${e.it.w}/${e.it.h}">${e.it.type === 'video' ? '<span class="play"><i></i></span><span class="tag">影片</span>' : ''}</button>`;
function bindTiles() { $('main').querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => openLb(+b.dataset.i))); fillImgs($('main')); }
function render() { current ? renderAlbum(current) : renderOverview(); }
function renderChips(cur) {
  $('chips').innerHTML = `<a class="chip" href="#all" ${!cur ? 'aria-current="page"' : ''}>全部活動</a>` + ALBUMS.map(a => `<a class="chip" href="#${a.id}" ${cur && cur.id === a.id ? 'aria-current="page"' : ''}>${esc(label(a.title))}<span class="n">${a.items.length}</span></a>`).join('');
  const on = $('chips').querySelector('[aria-current]'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function renderOverview() {
  const all = ALBUMS.flatMap(a => a.items);
  const head = `<div class="album-head"><h2>全部活動</h2><span class="meta">${counts({ items: all })}</span>${seg(all)}</div>`;
  view = [];
  if (filter === 'all') {
    const imgs = a => { const ph = a.items.filter(i => i.type === 'photo'); return (ph.length >= 3 ? ph : a.items).slice(0, 3).map(i => `<img data-enc="${i.thumb}" alt="">`).join(''); };
    $('main').innerHTML = head + `<div class="covers">${ALBUMS.map(a => `<a class="cover" href="#${a.id}"><div class="imgs">${imgs(a)}</div><div class="cap"><b>${esc(label(a.title))}</b><span>${counts(a)}</span></div></a>`).join('')}</div>`;
  } else {
    const word = filter === 'video' ? '段影片' : '張照片';
    $('main').innerHTML = head + ALBUMS.map(a => {
      const es = a.items.filter(match).map(it => ({ a, it })); if (!es.length) return '';
      const start = view.length; view.push(...es);
      return `<section class="group"><h3><a href="#${a.id}">${esc(label(a.title))}</a><span>${es.length} ${word}</span></h3><div class="grid">${es.map((e, k) => tile(e, start + k)).join('')}</div></section>`;
    }).join('');
  }
  bindSeg(); bindTiles();
}
function renderAlbum(a) {
  view = a.items.filter(match).map(it => ({ a, it }));
  $('main').innerHTML = `<div class="album-head"><h2>${esc(label(a.title))}</h2><span class="meta">${counts(a)}</span>${seg(a.items)}</div>` +
    (view.length ? `<div class="grid">${view.map(tile).join('')}</div>` : `<p class="empty">這個活動沒有${filter === 'video' ? '影片' : '照片'}，點「全部」看其他內容。</p>`);
  bindSeg(); bindTiles();
}
function route() {
  current = ALBUMS.find(a => a.id === location.hash.slice(1)) || null;
  closeLb(); renderChips(current); render(); window.scrollTo({ top: 0 });
}

let idx = 0, lastFocus = null, token = 0;
async function showLb() {
  const { a, it } = view[idx], my = ++token;
  $('lbTitle').textContent = `${label(a.title)} ・ ${it.name}`;
  $('lbCount').textContent = `${idx + 1} / ${view.length}`;
  $('lbMedia').innerHTML = '<div class="loading">載入中…</div>';
  try {
    const url = await blobUrl(it.src, it.mime); if (my !== token) return;
    const thumb = await blobUrl(it.thumb, 'image/jpeg').catch(() => '');
    $('lbMedia').innerHTML = it.type === 'video' ? `<video src="${url}" poster="${thumb}" controls playsinline></video>` : `<img src="${url}" alt="${esc(it.name)}">`;
  } catch (e) { if (my === token) $('lbMedia').innerHTML = '<div class="loading">載入失敗，請重新整理再試。</div>'; }
  const n = view[idx + 1]; if (n && n.it.type === 'photo') blobUrl(n.it.src, n.it.mime).catch(() => {});
}
function openLb(i) { idx = i; lastFocus = document.activeElement; $('lb').hidden = false; document.body.style.overflow = 'hidden'; showLb(); $('lbClose').focus(); }
function closeLb() { if ($('lb').hidden) return; token++; $('lb').hidden = true; $('lbMedia').innerHTML = ''; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
function step(d) { if (!view.length) return; idx = (idx + d + view.length) % view.length; showLb(); }
$('lbPrev').onclick = () => step(-1); $('lbNext').onclick = () => step(1); $('lbClose').onclick = closeLb;
$('lbStage').addEventListener('click', e => { if (e.target === $('lbStage')) closeLb(); });
document.addEventListener('keydown', e => { if ($('lb').hidden) return; if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
let tx = null;
$('lbStage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('lbStage').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });
</script>
</body>
